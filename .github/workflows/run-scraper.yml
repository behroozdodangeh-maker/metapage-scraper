name: Daily Lead Scraper

# ۱. زمان‌بندی اجرا
on:
  schedule:
    # اجرا هر روز ساعت 04:00 صبح به وقت UTC (حدود 7:30 صبح ایران)
    - cron: '0 4 * * *'
  # امکان اجرای دستی با یک کلیک
  workflow_dispatch:

jobs:
  run-python-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کدهای مخزن
        uses: actions/checkout@v3

      - name: آماده‌سازی محیط پایتون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌های مورد نیاز
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: اجرای ربات جستجوگر
        run: python metapage_scraper.py
