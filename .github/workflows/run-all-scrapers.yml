name: Daily Multi-Campaign Scraper

on:
  schedule:
    - cron: '0 4 * * *' # اجرا هر روز ساعت ۴ صبح
  workflow_dispatch: # امکان اجرای دستی با دکمه

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدهای مخزن
        uses: actions/checkout@v3

      - name: آماده‌سازی محیط پایتون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌های مورد نیاز
        run: pip install requests beautifulsoup4

      - name: Run Site Scraper
        run: python scraper_site.py
        
      - name: Run Viewer Scraper
        run: python scraper_viewer.py
        
      - name: Run Ads Scraper
        run: python scraper_ads.py
        
      - name: Run Expo Scraper
        run: python scraper_expo.py
