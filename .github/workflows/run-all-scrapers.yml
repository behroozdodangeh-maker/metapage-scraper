name: Daily Multi-Campaign Scraper

on:
  schedule:
    # دوشنبه‌ها: کمپین سایت
    - cron: '0 4 * * 1'
    # سه‌شنبه‌ها: کمپین تریدی ویوور
    - cron: '0 4 * * 2'
    # چهارشنبه‌ها: کمپین تبلیغات
    - cron: '0 4 * * 3'
    # پنجشنبه‌ها: کمپین متا اکسپو
    - cron: '0 4 * * 4'
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      
      # شرط اجرای فایل مربوط به هر روز
      - name: Run Site Scraper
        if: github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch'
        run: python scraper_site.py
        
      - name: Run Viewer Scraper
        if: github.event.schedule == '0 4 * * 2'
        run: python scraper_viewer.py
        
      - name: Run Ads Scraper
        if: github.event.schedule == '0 4 * * 3'
        run: python scraper_ads.py
        
      - name: Run Expo Scraper
        if: github.event.schedule == '0 4 * * 4'
        run: python scraper_expo.py
